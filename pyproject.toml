[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pikpak-fastlink"
version = "0.1.0"
description = "PikPak cloud-drive rapid-transfer CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["ijson>=3.3.0", "curl_cffi>=0.11.0,<1", "python-dotenv>=1.0,<2"]

[project.scripts]
pikpak-fastlink = "pikpak_fastlink.__main__:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["pikpak_fastlink*"]
